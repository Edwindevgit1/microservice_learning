services:
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: user-image
    container_name: user-container
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      MONGO_URL: mongodb://mongo:27017/user-service
    depends_on:
      - mongo
    restart: unless-stopped

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: product-image
    container_name: product-container
    ports:
      - "5002:5000"
    environment:
      PORT: 5000
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: mongo-container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
